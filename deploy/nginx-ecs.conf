# DevAsk 阿里云 ECS 生产站点 Nginx 配置（Alibaba Cloud Linux 3）
# 安装路径：/etc/nginx/conf.d/devask.conf
# 说明：
#   1. 采用明确 server_name（不占 default_server），支持同机部署多个子域名项目；
#   2. 前端由 GitHub Actions 构建并发布至 /opt/bagujing/current/frontend，ECS 零编译；
#   3. 阿里云单域名免费证书拆分为 fullchain.pem + privkey.key，存放在 /etc/nginx/ssl/devask.hanalice.net/；
#   4. 直连公网无前置 CDN 时，使用 X-Forwarded-For $remote_addr 防止客户端伪造 IP 绕过限流。

server {
    listen 80;
    listen [::]:80;
    server_name devask.hanalice.net;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devask.hanalice.net;
    server_tokens off;

    # 阿里云免费单域名证书（每 3 个月通过 scripts/update-ssl-cert.sh 更新）
    ssl_certificate     /etc/nginx/ssl/devask.hanalice.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/devask.hanalice.net/privkey.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:DEVASK_SSL:10m;
    ssl_session_timeout 10m;

    # 基础安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 静态文本资源压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    root /opt/bagujing/current/frontend;
    index index.html;

    # 前端构建产物（带 hash 指纹，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA 入口不缓存，确保发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vue Router History 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部监控指标接口：默认仅允许本机访问，不暴露到公网
    location = /api/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 探活接口（不记访问日志）
    location = /api/health {
        access_log off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 业务与 AI 流式（SSE）反向代理
    location /api/ {
        client_max_body_size 2m;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 直连 ECS 时用 $remote_addr 覆盖客户端 XFF，避免伪造 IP 绕过单 IP 限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关闭缓冲与缓存，保障 AI SSE 流式响应实时输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
