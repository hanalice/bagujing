# 这是 Nginx 的生产配置模板，请将其拷贝到 /etc/nginx/sites-available/bagujing 并建立软链接到 sites-enabled
# sudo ln -s /etc/nginx/sites-available/bagujing /etc/nginx/sites-enabled/
# 然后执行 sudo nginx -t && sudo systemctl reload nginx

server {
    # 监听 80 端口，并自动重定向到 HTTPS
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # 监听 443 端口，启用 SSL/TLS
    listen 443 ssl default_server;
    server_name _; 

    # 加载项目中已有的本地 SSL 证书
    # 证书被专门集中存放于系统的安全标准目录 /etc/nginx/ssl 下，Nginx 读取畅通无阻
    ssl_certificate /etc/nginx/ssl/bagujing/server.pem;
    ssl_certificate_key /etc/nginx/ssl/bagujing/server.pem;

    # 安全头部设置
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # 将所有对根路径的请求指向编译好的前端静态文件目录
    location / {
        # 静态文件存放在 Nginx 默认有访问权限的标准 web 目录
        root /var/www/bagujing/frontend; 
        index index.html index.htm;
        
        # 适用于 SPA(Vue/React) 的 History 路由回退机制
        # 如果找不着文件，最后一定要接一个 =404 或严格寻找 index.html 避免无限循环重定向
        try_files $uri $uri/ /index.html =404;
    }

    # 将 /api/ 下的请求反向代理到本地启动的 PM2 Node.js 集群
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        
        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 针对 AI 流式输出 (SSE) 优化的配置，避免 Nginx 缓冲导致卡顿
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
